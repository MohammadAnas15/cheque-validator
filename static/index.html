<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakistani Bank Cheque Validator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; }
    #drop-zone {
      border: 2px dashed #6c757d;
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fff;
    }
    #drop-zone.dragover { border-color: #0d6efd; background: #eef4ff; }
    #preview-img { max-height: 320px; object-fit: contain; border-radius: 8px; }
    .badge-match { font-size: 1rem; }
    .result-card { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .micr-text { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width: 760px;">
  <div class="text-center mb-4">
    <h1 class="fw-bold"><i class="bi bi-bank2 text-primary"></i> Cheque Validator</h1>
    <p class="text-muted">Upload a Pakistani bank cheque image to verify the MICR code and bank logo match.</p>
  </div>

  <!-- Upload area -->
  <div class="card shadow-sm mb-4">
    <div class="card-body p-4">
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <i class="bi bi-cloud-upload fs-1 text-secondary"></i>
        <p class="mt-2 mb-0 text-secondary">Drag &amp; drop a cheque image here, or click to browse</p>
        <small class="text-muted">JPEG, PNG, WebP — max 10 MB</small>
      </div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif" class="d-none" />

      <div id="preview-wrap" class="text-center mt-3 d-none">
        <img id="preview-img" src="" alt="Preview" class="img-fluid mb-3" />
        <br />
        <button id="analyze-btn" class="btn btn-primary px-4">
          <i class="bi bi-search me-1"></i> Analyze Cheque
        </button>
        <button id="reset-btn" class="btn btn-outline-secondary ms-2">
          <i class="bi bi-x-circle me-1"></i> Clear
        </button>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="text-center d-none my-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Analyzing with Claude vision…</p>
  </div>

  <!-- Error -->
  <div id="error-box" class="alert alert-danger d-none" role="alert"></div>

  <!-- Results -->
  <div id="results" class="d-none result-card">
    <!-- Not a cheque -->
    <div id="not-cheque-card" class="card border-warning shadow-sm d-none mb-4">
      <div class="card-body text-center py-4">
        <i class="bi bi-x-circle-fill text-warning fs-1"></i>
        <h4 class="mt-3">Not a Cheque</h4>
        <p id="not-cheque-notes" class="text-muted mb-0"></p>
      </div>
    </div>

    <!-- Is a cheque -->
    <div id="cheque-card" class="d-none">
      <!-- Match banner -->
      <div id="match-banner" class="card mb-3 shadow-sm d-none">
        <div class="card-body text-center py-3">
          <span id="match-icon" class="fs-1"></span>
          <h4 id="match-text" class="mt-2 mb-0"></h4>
        </div>
      </div>

      <div class="row g-3">
        <!-- MICR -->
        <div class="col-12">
          <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold"><i class="bi bi-upc-scan me-1"></i> MICR Line</div>
            <div class="card-body">
              <p id="micr-line" class="micr-text mb-0 text-dark fs-6"></p>
            </div>
          </div>
        </div>

        <!-- Bank code -->
        <div class="col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold"><i class="bi bi-hash me-1"></i> Bank Code (MICR)</div>
            <div class="card-body">
              <p id="bank-code" class="fs-4 fw-bold text-primary mb-1"></p>
              <p id="bank-name-code" class="text-muted mb-0 small"></p>
            </div>
          </div>
        </div>

        <!-- Logo bank -->
        <div class="col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold"><i class="bi bi-image me-1"></i> Bank Logo (Visual)</div>
            <div class="card-body">
              <p id="logo-bank" class="fs-5 fw-semibold text-dark mb-0"></p>
            </div>
          </div>
        </div>

        <!-- Confidence & notes -->
        <div class="col-12">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold"><i class="bi bi-info-circle me-1"></i> Details</div>
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <span class="text-muted">Confidence:</span>
                <span id="confidence-badge" class="badge fs-6"></span>
              </div>
              <p id="notes" class="text-muted mb-0 small"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const analyzeBtn = document.getElementById('analyze-btn');
  const resetBtn = document.getElementById('reset-btn');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error-box');
  const results = document.getElementById('results');
  let selectedFile = null;

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(f) {
    selectedFile = f;
    previewImg.src = URL.createObjectURL(f);
    previewWrap.classList.remove('d-none');
    hideResults();
  }

  function hideResults() {
    results.classList.add('d-none');
    errorBox.classList.add('d-none');
  }

  resetBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    previewWrap.classList.add('d-none');
    previewImg.src = '';
    hideResults();
  });

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    hideResults();
    loading.classList.remove('d-none');
    analyzeBtn.disabled = true;

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('/api/analyze', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        showError(data.detail || `Error ${res.status}`);
        return;
      }
      renderResults(data);
    } catch (err) {
      showError('Network error — is the server running?');
    } finally {
      loading.classList.add('d-none');
      analyzeBtn.disabled = false;
    }
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('d-none');
  }

  function renderResults(d) {
    results.classList.remove('d-none');
    const notCheque = document.getElementById('not-cheque-card');
    const chequeCard = document.getElementById('cheque-card');

    if (!d.is_cheque) {
      notCheque.classList.remove('d-none');
      chequeCard.classList.add('d-none');
      document.getElementById('not-cheque-notes').textContent = d.notes || '';
      return;
    }

    notCheque.classList.add('d-none');
    chequeCard.classList.remove('d-none');

    // Match banner
    const matchBanner = document.getElementById('match-banner');
    const matchIcon = document.getElementById('match-icon');
    const matchText = document.getElementById('match-text');
    if (d.is_match !== null && d.is_match !== undefined) {
      matchBanner.classList.remove('d-none');
      if (d.is_match) {
        matchBanner.querySelector('.card-body').className = 'card-body text-center py-3 bg-success-subtle';
        matchIcon.textContent = '';
        matchText.textContent = 'Bank code and logo match';
        matchText.className = 'mt-2 mb-0 text-success fw-bold';
      } else {
        matchBanner.querySelector('.card-body').className = 'card-body text-center py-3 bg-danger-subtle';
        matchIcon.textContent = '';
        matchText.textContent = 'Mismatch — bank code and logo differ';
        matchText.className = 'mt-2 mb-0 text-danger fw-bold';
      }
    } else {
      matchBanner.classList.add('d-none');
    }

    document.getElementById('micr-line').textContent = d.micr_line || '(not readable)';
    document.getElementById('bank-code').textContent = d.bank_code || '—';
    document.getElementById('bank-name-code').textContent = d.bank_name_from_code || '';
    document.getElementById('logo-bank').textContent = d.logo_bank || '(not identified)';

    const conf = d.confidence || 'unknown';
    const confBadge = document.getElementById('confidence-badge');
    confBadge.textContent = conf;
    confBadge.className = 'badge fs-6 ' + ({
      high: 'bg-success', medium: 'bg-warning text-dark', low: 'bg-danger'
    }[conf] || 'bg-secondary');

    document.getElementById('notes').textContent = d.notes || '';
  }
</script>
</body>
</html>
